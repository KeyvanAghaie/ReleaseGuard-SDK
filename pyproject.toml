[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "releaseguard-sdk"
version = "0.1.0"
description = "Privacy-conscious sync and async instrumentation for Python LLM applications."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2.10,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.30,<2"]
demo = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "build>=1.2,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/releaseguard_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.vercel]
entrypoint = "app:app"

