name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[demo,dev,otel]"
      - name: Verify tag matches package
        run: |
          python -c "import os, releaseguard_sdk; assert os.environ['GITHUB_REF_NAME'] == 'v' + releaseguard_sdk.__version__"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python -m build
      - run: python benchmarks/overhead.py --output benchmarks/results/release.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* benchmarks/results/release.json --title "$GITHUB_REF_NAME" --notes-file docs/CHANGELOG.md

