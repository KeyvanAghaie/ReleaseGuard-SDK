name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: python -m pip install -e ".[demo,dev,otel]"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python -m build
      - run: python examples/basic.py
      - run: python benchmarks/overhead.py --output benchmarks/results/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: packages-and-benchmark
          path: |
            dist/
            benchmarks/results/ci.json

